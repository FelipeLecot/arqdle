services:
  db:
    image: postgres:17-alpine
    container_name: arqdle-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: arqdle
      POSTGRES_PASSWORD: arqdle_dev_password
      POSTGRES_DB: arqdle
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - arqdle_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arqdle -d arqdle"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  arqdle_pgdata:
